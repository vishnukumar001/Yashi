appId: com.yashi.desktop
productName: Yashi
copyright: Copyright © 2026 Vishnu Jadaun (Rudra)
author: Vishnu Jadaun (Rudra)

directories:
  output: release
  buildResources: build

# The backend runs as a separate Node process that serves static files and
# reads modules from disk, so we keep the app unpacked (no asar) to guarantee
# those paths resolve identically to development.
asar: false

files:
  - electron/**/*
  - dist/**/*
  - assets/**/*
  - package.json

# The PyInstaller-frozen desktop agent (embeds its own Python runtime) is copied
# verbatim into resources/agent, so the target machine needs no Python.
# On macOS the frozen bundle is `yashi-agent` (a directory-based .app).
extraResources:
  - from: agent_dist/yashi-agent
    to: agent
    filter: ["**/*"]

mac:
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  category: public.app-category.productivity
  # Icon lives at build/icon.icns (buildResources dir).
  icon: build/icon.icns
  # Hardened runtime + ad-hoc signing keeps Gatekeeper happy on Apple Silicon
  # even without a paid Apple Developer certificate. The resulting .app runs
  # on the machine that built it; for distribution to others you must either
  # notarize with a Developer ID or have recipients right-click → Open.
  hardenedRuntime: true
  gatekeeperAssess: false
  artifactName: ${productName}-${version}-${arch}.${ext}
  extendInfo:
    NSMicrophoneUsageDescription: "Yashi requires microphone access to enable real-time holographic voice communication."

dmg:
  title: ${productName} ${version}
  artifactName: ${productName}-${version}.${ext}
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
